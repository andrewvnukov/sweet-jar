<style>
  :root{
    --ink:#5B4636; --ink-soft:#9A8570; --line:#6B5340;
    --paper:#FFF8E6;
    --accent:#FF8FA3; --accent-deep:#E8637C;
    --gold:#F2C14E; --mint:#8FD9C4; --lav:#C7A6E8;
    --bg:#FCE8D8;
    --wood:#C89464; --wood-deep:#A8763F; --sky:#BEE3F5; --jar:#EAF6FB;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);position:fixed;inset:0;background:var(--bg)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
       padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
       max-width:520px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:flex-start}
  .chip{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px 6px 8px;
        display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(91,70,54,.28)}
  .cico{width:26px;height:26px;flex:none}
  .chip .ctxt{display:flex;flex-direction:column;gap:1px}
  .chip .v{font-weight:900;font-size:17px;line-height:1}
  .chip .l{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.3px}
  .spacer{flex:1}
  /* ── полоса цели (задание кондитера) ── */
  #goalBar{margin-top:8px;align-self:flex-start;width:min(100%,330px);pointer-events:auto;cursor:default;
           background:var(--paper);border:2.5px solid var(--line);border-radius:14px;
           padding:6px 10px 7px;box-shadow:0 3px 0 rgba(91,70,54,.25)}
  #goalBar.done{background:var(--gold);border-color:#C9982E;cursor:pointer;
                animation:goalPulse 1.1s ease-in-out infinite}
  @keyframes goalPulse{0%,100%{box-shadow:0 3px 0 rgba(91,70,54,.25)}
                       50%{box-shadow:0 3px 0 rgba(91,70,54,.25),0 0 0 4px rgba(242,193,78,.45)}}
  #goalBar .gtop{display:flex;align-items:baseline;gap:8px}
  #goalBar .gn{flex:1;min-width:0;font-size:12.5px;font-weight:900;line-height:1.15;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #goalBar .gr{font-size:11.5px;font-weight:900;color:#B2762A;white-space:nowrap}
  #goalBar.done .gr{color:var(--ink)}
  #goalBar .gtrack{height:7px;margin-top:5px;border-radius:99px;background:rgba(91,70,54,.16);overflow:hidden}
  #goalBar .gfill{height:100%;width:0;border-radius:99px;background:var(--mint);transition:width .3s}
  .collnote{font-size:12.5px;font-weight:800;color:var(--ink-soft);margin:-2px 0 8px}
  /* альбом: полоса цели не должна накрывать предпросмотр следующей конфеты */
  @media (max-height:430px){ #goalBar{width:min(100%,210px);margin-top:6px} }
  #goalBar.done .gfill{background:var(--ink)}
  .side{display:flex;flex-direction:column;gap:8px;margin-left:8px;pointer-events:auto}
  .rbtn{width:44px;height:44px;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);
        box-shadow:0 3px 0 rgba(91,70,54,.28);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .rbtn svg{width:22px;height:22px}
  .bottom{display:flex;gap:8px;pointer-events:auto}
  .abtn{flex:1;min-height:58px;background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:8px 3px;
        font-weight:900;font-size:12.5px;cursor:pointer;box-shadow:0 3px 0 rgba(91,70,54,.28);
        transition:transform .08s,box-shadow .08s;color:var(--ink);display:flex;flex-direction:column;gap:3px;
        align-items:center;justify-content:center;text-align:center;line-height:1.1}
  .abtn .lab{font-size:11.5px;white-space:normal}
  .abtn .sub{font-size:10px;font-weight:800;opacity:.85;white-space:nowrap}
  .abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(91,70,54,.28)}
  .abtn:disabled{opacity:.55;cursor:default}
  .abtn.special{background:var(--wood);color:#fff;border-color:var(--wood-deep)}
  .abtn.gift{background:var(--mint);color:#274b3f;border-color:#5fae91}
  .abtn.shake{background:var(--lav);color:#3d2c56;border-color:#9a7ac9}
  #toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:99px;
         opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center;z-index:5}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{position:absolute;inset:0;background:rgba(58,40,28,.5);display:flex;align-items:center;justify-content:center;
         opacity:0;pointer-events:none;transition:.2s;z-index:10}
  .modal.on{opacity:1;pointer-events:auto}
  .card{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:16px;width:min(90vw,420px);
        max-height:82vh;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.2)}
  .card h2{font-size:19px;font-weight:900;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .card h2 .x{cursor:pointer;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--line);
             display:flex;align-items:center;justify-content:center;font-weight:900}
  .uprow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--ink-soft)}
  .uprow:last-child{border-bottom:none}
  .uprow .ui{flex:1}
  .uprow .un{font-weight:900;font-size:14.5px}
  .uprow .ud{font-size:11.5px;color:var(--ink-soft);font-weight:700}
  .uprow button{background:var(--accent);color:#fff;border:2px solid var(--accent-deep);border-radius:12px;
               padding:8px 12px;font-weight:900;font-size:12.5px;min-width:76px}
  .uprow button:disabled{background:#cfcfcf;border-color:#a9a9a9;color:#777}
  .cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ccell{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center}
  .ccell canvas{width:100%;height:auto;display:block}
  .ccell .cn{font-size:9.5px;font-weight:800;margin-top:2px;line-height:1.15}
  .ccell.locked{opacity:.35}
  /* нижний ряд: 4 кнопки. На узких экранах (320-400px) — сетка 2x2, дальше один ряд */
  .bottom{flex-wrap:wrap;gap:6px}
  .abtn{flex:1 1 calc(50% - 3px);min-width:0}
  @media(min-width:430px){ .abtn{flex:1 1 0} }
  .abtn.specialad{background:var(--gold);color:#4A3712;border-color:#C9982E}
  /* модалки: ежедневка, конец забега, ярлык */
  .mrow{display:flex;gap:8px;margin-top:12px}
  .mbtn{flex:1;background:var(--accent);color:#fff;border:2.5px solid var(--accent-deep);border-radius:14px;
        padding:11px 6px;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit;line-height:1.15;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .mbtn .msub{font-size:10px;font-weight:800;opacity:.9}
  .mbtn.alt{background:var(--paper);color:var(--ink);border-color:var(--line)}
  .mbtn.ad{background:var(--mint);color:#274B3F;border-color:#5FAE91}
  .orun{font-weight:900;font-size:16px}
  .obonus{font-weight:800;font-size:14px;color:var(--ink-soft);margin-top:2px}
  .obest{font-weight:900;font-size:14px;color:var(--accent-deep);min-height:18px;margin-top:2px}
  .scd{font-weight:700;font-size:13.5px;line-height:1.35}
  .dstreak{font-weight:800;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
  .dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .dcell{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;
         font-weight:800;font-size:11px}
  .dcell .dv{font-size:11.5px;font-weight:900;margin-top:2px}
  .dcell.done{background:var(--mint)}
  .dcell.now{background:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.5)}
  /* контекстная подсказка: явная ширина, иначе у правых кнопок текст схлопнется в колонку */
  #tip{position:fixed;left:50%;top:0;width:210px;transform:translate(-50%,-100%);
       background:var(--ink);color:#fff;font-weight:800;font-size:12.5px;line-height:1.28;text-align:center;
       padding:9px 12px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
  #tip.on{opacity:1}
  .tip-target{animation:tipPulse 1.3s ease-in-out infinite}
  @keyframes tipPulse{
    0%,100%{box-shadow:0 3px 0 rgba(91,70,54,.28),0 0 0 0 rgba(232,99,124,.85)}
    50%    {box-shadow:0 3px 0 rgba(91,70,54,.28),0 0 0 8px rgba(232,99,124,0)}
  }
  @media(max-height:600px){ #toast{bottom:150px} }
  @media(max-width:340px){
    #hud{padding-left:8px;padding-right:8px}
    .chip{padding:5px 9px 5px 6px;gap:6px} .chip .v{font-size:15px} .cico{width:22px;height:22px}
    .rbtn{width:40px;height:40px} .abtn .lab{font-size:11px} .abtn{min-height:54px}
  }
</style>
</head>

}

}

const T = (k,vars) => { let s=(STR[k]||{})[lang()] || (STR[k]||{}).ru || k;

// ---------- Десерты (тиры) ----------
const TIERS = [
  {key:'t0', ratio:0.072, value:2,  fill:'#F3F7FA', accent:'#DCE9EE'},
  {key:'t1', ratio:0.093, value:4,  fill:'#FF9EAE', accent:'#E8637C'},

  {key:'t4', ratio:0.196, value:32, fill:'#F6C9DC', accent:'#D98BAE'},
  {key:'t5', ratio:0.245, value:64, fill:'#FFE3B0', accent:'#E2A64F'},
  {key:'t6', ratio:0.305, value:128,fill:'#F9D8A8', accent:'#C98B45'},
  {key:'t7', ratio:0.380, value:256,fill:'#FF8FA3', accent:'#B23A54'},
];
const MAX_TIER = TIERS.length-1;

// ---------- Состояние ----------
// v:2 — добавлены lifetimeEarned, up.mult, lastClaimDay/streak, tips, флаги ярлыка/оценки.
function fresh(){
  return { v:2, coins:0, bestTier:0, bestScore:0, fillCoins:0, lifetimeEarned:0, discovered:[0],
    up:{pool:0, luck:0, cap:0, mult:0}, lastGift:0, lastShake:0, lastSpecialAd:0,
    lastClaimDay:"", streak:0, tips:{}, shortcutDone:false, reviewDone:false, goal:0,
    balls:[], time:Date.now() };
}
let S = fresh();
let runBestTier=0;          // лучший тир текущего забега (в сейв не идёт)
let paused=false, gameOver=false;

// ---------- Экономика / апгрейды ----------
// Кривая цены: base * costMul^n. Линейные эффекты живут 5-12 уровней,
// множительный (glaze) — десятки: costMul/k = 1.35/1.12 ≈ 1.2 за уровень.
const POOL_MAX=2, LUCK_MAX=10, CAP_MAX=10, MULT_MAX=40;
const poolMax   = () => Math.min(1+S.up.pool, 3);
const poolCost  = () => S.up.pool>=POOL_MAX ? Infinity : Math.floor(120*Math.pow(1.9, S.up.pool));
const luckCost  = () => S.up.luck>=LUCK_MAX ? Infinity : Math.floor(90*Math.pow(1.55, S.up.luck));
const capCost   = () => S.up.cap >=CAP_MAX  ? Infinity : Math.floor(150*Math.pow(1.6,  S.up.cap));
const multCost  = () => S.up.mult>=MULT_MAX ? Infinity : Math.floor(400*Math.pow(1.35, S.up.mult));
const multValue = () => Math.pow(1.12, S.up.mult);
const specialCost = () => 80 + S.bestTier*40;
const GIFT_CD = 90*1000, SHAKE_CD = 3*60*1000, SPECIAL_AD_CD = 120*1000;
const SHORTCUT_REWARD = 300;
// Награда подарка привязана к темпу игрока, а не к фиксированным «+50».
function giftReward(){
  return Math.max(50, Math.floor(TIERS[Math.min(MAX_TIER,S.bestTier)].value*6 + S.fillCoins*0.2));
}
const giftReady      = () => Date.now()-S.lastGift      >= GIFT_CD;
const shakeReady     = () => Date.now()-S.lastShake     >= SHAKE_CD;
const specialAdReady = () => Date.now()-S.lastSpecialAd >= SPECIAL_AD_CD;

// Заработок (слияния) двигает метрики прогресса, подарки — только кошелёк.
function earn(n){ n=Math.max(0,Math.floor(n)); S.coins+=n; S.lifetimeEarned+=n; return n; }
function grant(n){ n=Math.max(0,Math.floor(n)); S.coins+=n; return n; }

// ---------- Задания кондитера ----------
// В merge-игре без цели игрок не знает, зачем кидать следующую конфету: забег
// кончается, банка чистится, видимого движения нет. Цепочка заданий держит
// ближайшую цель на экране и сшивает забеги в один длинный прогресс.
// Награда — grant: задание не должно разгонять собственные же цели по заработку.
const tierName = t => T(TIERS[Math.min(MAX_TIER,Math.max(0,t))].key);
const goalCoins = k => Math.max(100, Math.floor(TIERS[Math.min(MAX_TIER,S.bestTier)].value*k + S.bestScore*0.05));
const GOALS = [
  { id:'t1',   text:()=>T('gMake',{n:tierName(1)}),  need:()=>1, cur:()=>S.bestTier, rew:()=>({coins:goalCoins(8)}) },
  { id:'t2',   text:()=>T('gMake',{n:tierName(2)}),  need:()=>2, cur:()=>S.bestTier, rew:()=>({coins:goalCoins(10)}) },
  { id:'up1',  text:()=>T('gUp'),                    need:()=>1,
    cur:()=>S.up.pool+S.up.luck+S.up.cap+S.up.mult,                 rew:()=>({coins:goalCoins(12)}) },
  { id:'t3',   text:()=>T('gMake',{n:tierName(3)}),  need:()=>3, cur:()=>S.bestTier, rew:()=>({coins:goalCoins(14)}) },
  { id:'mult3',text:()=>T('gMult',{n:3}),            need:()=>3, cur:()=>S.up.mult,  rew:()=>({coins:goalCoins(16)}) },
  { id:'t4',   text:()=>T('gMake',{n:tierName(4)}),  need:()=>4, cur:()=>S.bestTier, rew:()=>({coins:goalCoins(18), special:true}) },
  { id:'cap3', text:()=>T('gCap',{n:3}),             need:()=>3, cur:()=>S.up.cap,   rew:()=>({coins:goalCoins(20)}) },
  { id:'t5',   text:()=>T('gMake',{n:tierName(5)}),  need:()=>5, cur:()=>S.bestTier, rew:()=>({coins:goalCoins(24)}) },
  { id:'sc3k', text:()=>T('gScore',{n:fmt(3000)}),   need:()=>3000, cur:()=>S.bestScore, rew:()=>({coins:goalCoins(28)}) },
  { id:'t6',   text:()=>T('gMake',{n:tierName(6)}),  need:()=>6, cur:()=>S.bestTier, rew:()=>({coins:goalCoins(32), special:true}) },
  { id:'mult8',text:()=>T('gMult',{n:8}),            need:()=>8, cur:()=>S.up.mult,  rew:()=>({coins:goalCoins(36)}) },
  { id:'t7',   text:()=>T('gMake',{n:tierName(7)}),  need:()=>7, cur:()=>S.bestTier, rew:()=>({coins:goalCoins(48), special:true}) },
];
const GOAL_EARN_BASE = 60000;               // первая бесконечная цель — после первого торта
function goalDef(){
  const i=S.goal;
  if(i < GOALS.length) return GOALS[i];
  // Кламп: на больших номерах степень уходит в Infinity, и цель перестаёт быть целью.
  const n = Math.round(Math.min(Number.MAX_SAFE_INTEGER, GOAL_EARN_BASE * Math.pow(4, i-GOALS.length)));
  return { id:'earn'+(i-GOALS.length), endless:true,
           text:()=>T('gEarn',{n:fmt(n)}), need:()=>n, cur:()=>S.lifetimeEarned,
           rew:()=>({coins:goalCoins(40), special:true}) };
}
const goalReady = () => { const g=goalDef(); return g.cur() >= g.need(); };
function claimGoal(){
  const g=goalDef(); if(g.cur() < g.need()) return false;
  const r=g.rew();
  const c=grant(r.coins);                   // награда — подарок, а не заработок
  if(r.special) nextTier = Math.min(MAX_TIER, poolMax()+2);
  S.goal++;
  refreshHud(); persist(true); sfx('coin');
  toast(T('goalDone',{n:fmt(c)}) + (r.special ? " " + T('goalSpecial') : ""));
  return true;
}
function skipDoneGoals(){ let guard=0; while(goalReady() && guard++ < 64) S.goal++; }
function refreshGoal(){
  const g=goalDef(), need=g.need(), cur=Math.min(need, g.cur()), done=cur>=need, r=g.rew();
  const bar=$("goalBar"); if(!bar) return;
  bar.classList.toggle("done", done);
  $("goalT").textContent = done ? T('goalTake') : g.text();
  $("goalR").textContent = "+"+fmt(r.coins)+(r.special?" ✦":"");
  $("goalFill").style.width = Math.max(0, Math.min(100, 100*cur/need))+"%";
}

// ---------- Сейвы ----------
function snapshot(){
  S.balls = balls.map(b=>({x:b.x,y:b.y,t:b.t}));
  return JSON.stringify(S);
}
function writeSave(raw, flush){
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
  if(player){ try{ player.setData({save:raw}, !!flush); }catch(e){} }
}
function persist(force){
  const now=Date.now();
  if(!force && now-saveT<10000) return;
  saveT=now;
  writeSave(snapshot(), false);
}
let flushT=0;
// Дожим при уходе со страницы: не чаще раза в 3 с, иначе дёрганое
// переключение вкладок сожжёт лимит платформы (100 запросов / 5 минут).
function flushSave(){
  const now=Date.now();
  if(now-flushT<3000) return;
  flushT=now; saveT=now;
  writeSave(snapshot(), true);
}
// Валидаторы: сейв приходит из облака — возможно, с другого устройства
// или из другой версии игры, поэтому доверять ему нельзя ничему.
const isTier = t => Number.isInteger(t) && t>=0 && t<=MAX_TIER;
function num(v, def, min, max){
  const n=Number(v);
  if(!Number.isFinite(n)) return def;
  return Math.min(max==null?Infinity:max, Math.max(min==null?-Infinity:min, n));
}
const intIn = (v,min,max) => Math.floor(num(v,min,min,max));
const dayStr = ts => new Date(ts==null?Date.now():ts).toISOString().slice(0,10);
const isDay  = s => typeof s==="string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
// Возвращает true, если сейв реально прочитан (нужно, чтобы не показывать
// ежедневку самому первому игроку на первом же запуске).
function restore(raw){
  S = fresh();
  if(!raw) return false;
  let d=null;
  try{
    if(typeof raw==="string") d=JSON.parse(raw);
    else if(typeof raw==="object"){
      if(typeof raw.save==="string") d=JSON.parse(raw.save);
      else if(raw.save && typeof raw.save==="object") d=raw.save;
      else d=raw;
    }
  }catch(e){ S=fresh(); return false; }   // мусор вместо JSON — стартуем с чистого состояния
  if(!d || typeof d!=="object" || Array.isArray(d)){ S=fresh(); return false; }
  const now=Date.now(), s=fresh();
  s.coins     = Math.floor(num(d.coins,0,0));
  s.bestTier  = isTier(d.bestTier) ? d.bestTier : 0;
  s.bestScore = Math.floor(num(d.bestScore,0,0));
  s.fillCoins = Math.floor(num(d.fillCoins,0,0));
  // старым сейвам без lifetimeEarned — разумная оценка по кошельку и рекорду
  s.lifetimeEarned = Number.isFinite(Number(d.lifetimeEarned))
    ? Math.floor(Math.max(0,Number(d.lifetimeEarned))) : s.coins + s.bestScore;
  const disc = Array.isArray(d.discovered) ? d.discovered.filter(isTier) : [];
  s.discovered = Array.from(new Set(disc.concat([0]))).sort((a,b)=>a-b);
  const u = (d.up && typeof d.up==="object" && !Array.isArray(d.up)) ? d.up : {};
  s.up = { pool:intIn(u.pool,0,POOL_MAX), luck:intIn(u.luck,0,LUCK_MAX),
           cap:intIn(u.cap,0,CAP_MAX),   mult:intIn(u.mult,0,MULT_MAX) };
  s.lastGift      = Math.min(now, Math.floor(num(d.lastGift,0,0)));
  s.lastShake     = Math.min(now, Math.floor(num(d.lastShake,0,0)));
  s.lastSpecialAd = Math.min(now, Math.floor(num(d.lastSpecialAd,0,0)));
  s.lastClaimDay  = isDay(d.lastClaimDay) ? d.lastClaimDay
                    : (num(d.lastDaily,0,0)>0 ? dayStr(num(d.lastDaily,0,0)) : "");   // миграция v1
  s.streak = intIn(d.streak,0,3650);
  if(s.lastClaimDay && !s.streak) s.streak=1;
  s.tips = (d.tips && typeof d.tips==="object" && !Array.isArray(d.tips)) ? Object.assign({}, d.tips) : {};
  s.shortcutDone = !!d.shortcutDone; s.reviewDone = !!d.reviewDone;
  s.goal = intIn(d.goal,0,999);
  // неизвестный тир — выбросить элемент, а НЕ подрезать к MAX_TIER:
  // подрезка подарила бы игроку самую дорогую конфету бесплатно
  s.balls = Array.isArray(d.balls)
    ? d.balls.filter(b => b && typeof b==="object" && isTier(b.t)
        && Number.isFinite(Number(b.x)) && Number.isFinite(Number(b.y)))
        .map(b => ({x:Number(b.x), y:Number(b.y), t:b.t}))
        .slice(0,90)
    : [];
  s.time = Math.floor(num(d.time, now, 0));
  S = s;
  // Старый сейв без заданий: выполненное проматываем без наград, иначе
  // действующий игрок при первом запуске соберёт десяток наград подряд.
  if(!Number.isFinite(Number(d.goal))) skipDoneGoals();
  return true;
}

// ---------- Реклама ----------
const AD_GAP_S=210, AD_WARMUP_S=90, AD_RETRY_S=45;
let nextAdAt=0, adBusy=false;
// Частотой управляет сама платформа: если позвать слишком часто, показа не будет
// и onClose вернёт wasShown:false — тогда возвращаемся раньше, показ был бесплатным.
function showInterstitial(){
  if(adBusy || !(ysdk && ysdk.adv && ysdk.adv.showFullscreenAdv)) return;
  adBusy=true;
  const finish = wasShown => { adBusy=false; audioResume();
    nextAdAt = Date.now() + (wasShown?AD_GAP_S:AD_RETRY_S)*1000; };
  try{
    ysdk.adv.showFullscreenAdv({callbacks:{
      onOpen:()=>audioSuspend(), onClose:was=>finish(!!was), onError:()=>finish(false) }});
  }catch(e){ finish(false); }
}
// Только в естественной паузе (конец забега), никогда во время активной игры.
function maybeInterstitial(){
  if(!booted || document.hidden || adBusy) return;
  if(Date.now() < nextAdAt) return;
  if(Date.now()-sessionStart < AD_WARMUP_S*1000) return;   // не встречаем игрока рекламой
  if(anyModalOpen()) return;
  showInterstitial();
}
// Защёлка: onError может прийти ПОСЛЕ onRewarded — награда не должна удвоиться.
function showRewarded(onReward){
  if(!ysdk || !ysdk.adv){ onReward(); return; }
  let paid=false; const pay=()=>{ if(!paid){ paid=true; onReward(); } };
  try{
    ysdk.adv.showRewardedVideo({callbacks:{
      onOpen:     ()=>audioSuspend(),
      onRewarded: pay,
      onClose:    ()=>audioResume(),
      onError:    ()=>{ audioResume(); pay(); },
    }});
  }catch(e){ onReward(); }
}

// ---------- Лидерборд ----------
// Два поколения API: у sdk.leaderboards — setScore, у getLeaderboards() — setLeaderboardScore.
let lbT=0;
function submitScore(v){
  const score=Math.floor(Number(v)||0);
  if(score<=0) return;                       // пустые записи таблицу не засоряют
  if(!lb || !LB_NAME || !authorized) return; // писать можно только за авторизованного игрока
  const now=Date.now();
  if(now-lbT<1000) return;                   // лимит платформы: не чаще 1 раза в секунду
  lbT=now;
  try{
    const set = (typeof lb.setScore==="function") ? lb.setScore
              : (typeof lb.setLeaderboardScore==="function") ? lb.setLeaderboardScore : null;
    if(!set) return;
    const p = set.call(lb, LB_NAME, score);
    if(p && typeof p.catch==="function") p.catch(()=>{});
  }catch(e){}
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const SUF = ["","K","M","B","T","Qa","Qi"];
// Округляем только при показе, начисления остаются точными.
function fmt(n){
  n = Number(n)||0;
  const sign = n<0 ? "-" : ""; n = Math.abs(n);
  if(n<1000) return sign+Math.floor(n).toString();
  let i=0;
  while(n>=1000 && i<SUF.length-1){ n/=1000; i++; }
  if(n>=1000) return sign+n.toExponential(2).replace("e+","e");   // за пределами Qi — научная запись
  return sign + (n<10 ? n.toFixed(2) : n<100 ? n.toFixed(1) : Math.floor(n).toString()) + SUF[i];
}
function refreshHud(){
  $("coinsV").textContent = fmt(S.coins);
  $("coinsL").textContent = T("coins");
  $("bestV").textContent  = fmt(S.bestScore);
  $("bestL").textContent  = T("best");
  $("specialLab").textContent = T("special");
  $("specialSub").textContent = fmt(specialCost());
  $("specialAdLab").textContent = T("specialAd");
  $("giftLab").textContent = T("gift");
  $("shakeLab").textContent = T("shake");
  refreshActions();
  refreshGoal();
  $("shopTitle").textContent = T("shopTitle");
  $("collTitle").textContent = T("collTitle");
  renderShop(); renderCollection();
}
// Кулдауны rewarded-кнопок тикают сами — иначе кнопка выглядит выключенной
// до ближайшей полной перерисовки HUD.
function refreshActions(){
  const now=Date.now();
  const giftLeft = GIFT_CD-(now-S.lastGift), shakeLeft = SHAKE_CD-(now-S.lastShake),
        spAdLeft = SPECIAL_AD_CD-(now-S.lastSpecialAd);
  const cd = ms => T("wait")+" "+(ms>60000 ? Math.ceil(ms/60000)+"m" : Math.ceil(ms/1000)+"s");
  $("giftBtn").disabled = giftLeft>0;
  $("giftSub").textContent = giftLeft>0 ? cd(giftLeft) : T("watch")+" +"+fmt(giftReward());
  $("shakeBtn").disabled = shakeLeft>0;
  $("shakeSub").textContent = shakeLeft>0 ? cd(shakeLeft) : T("watch")+" (-3)";
  $("specialAdBtn").disabled = spAdLeft>0;
  $("specialAdSub").textContent = spAdLeft>0 ? cd(spAdLeft) : T("watch");
  $("specialBtn").disabled = S.coins < specialCost();
}
let toastT;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1600); }

// ---------- Магазин (модалка) ----------
function renderShop(){
  const list=$("upList"); list.innerHTML='';
  const rows=[
    {key:'pool', name:T('upPool'), desc:T('upPoolD'), lvl:S.up.pool, cost:poolCost(), buy:buyPool},
    {key:'luck', name:T('upLuck'), desc:T('upLuckD'), lvl:S.up.luck, cost:luckCost(), buy:buyLuck},
    {key:'cap',  name:T('upCap'),  desc:T('upCapD'),  lvl:S.up.cap,  cost:capCost(),  buy:buyCap},
    {key:'mult', name:T('upMult'), desc:T('upMultD')+' (×'+multValue().toFixed(2)+')',
                 lvl:S.up.mult, cost:multCost(), buy:buyMult},
  ];
  for(const r of rows){
    const div=document.createElement('div'); div.className='uprow';
    const ui=document.createElement('div'); ui.className='ui';
    ui.innerHTML='<div class="un">'+r.name+' · Lv'+r.lvl+'</div><div class="ud">'+r.desc+'</div>';
    const btn=document.createElement('button'); btn.setAttribute('data-key', r.key);
    const maxed = !Number.isFinite(r.cost);
    btn.textContent = maxed ? T('max') : fmt(r.cost);
    btn.disabled = maxed || S.coins < r.cost;
    btn.onclick = r.buy;
    div.appendChild(ui); div.appendChild(btn);
    list.appendChild(div);
  }
}
function buyPool(){ const c=poolCost(); if(!Number.isFinite(c)||S.coins<c) return; S.coins-=c; S.up.pool++; refreshHud(); persist(true); sfx('buy'); }
function buyLuck(){ const c=luckCost(); if(!Number.isFinite(c)||S.coins<c) return; S.coins-=c; S.up.luck++; refreshHud(); persist(true); sfx('buy'); }
// линию переполнения пересчитываем сразу: апгрейд должен работать без перезагрузки
function buyCap(){  const c=capCost();  if(!Number.isFinite(c)||S.coins<c) return; S.coins-=c; S.up.cap++;  computeOverflowY(); refreshHud(); persist(true); sfx('buy'); }
function buyMult(){ const c=multCost(); if(!Number.isFinite(c)||S.coins<c) return; S.coins-=c; S.up.mult++; refreshHud(); persist(true); sfx('buy'); }

// ---------- Коллекция (модалка) ----------

function doSpecial(){
  const c=specialCost();
  if(S.coins<c){ toast(T("need")); sfx("error"); return; }
  S.coins-=c; refreshHud(); persist(true); sfx("buy");
  nextTier = Math.min(MAX_TIER, poolMax()+2);

function doSpecialAd(){
  if(!specialAdReady()) return;
  showRewarded(()=>{
    S.lastSpecialAd=Date.now();
    nextTier = Math.min(MAX_TIER, poolMax()+2);
    refreshHud(); persist(true); sfx("buy");
    toast(T("specialGot"));
  });
}
function doGift(){
  if(!giftReady()) return;
  showRewarded(()=>{
    S.lastGift=Date.now();
    const n=grant(giftReward());          // подарок — не заработок, метрики прогресса не двигает
    refreshHud(); persist(true); sfx("coin");
    toast(T("giftGot",{n:fmt(n)}));
  });
}
function doShake(){
  if(!shakeReady()) return;
  showRewarded(()=>{
    S.lastShake=Date.now();
    balls.sort((a,b)=>a.r-b.r);
    const removed = balls.splice(0, Math.min(3, balls.length));
    refreshHud(); persist(true); sfx("buy");
    toast(T("shakeGot",{n:removed.length}));
  });
}

// ---------- Ежедневный бонус ----------
// Сравниваем строку даты, а не таймстемпы: иначе «сутки» едут относительно
// того, во сколько игрок зашёл в первый раз.
const DAILY_MULT=[1, 1.2, 1.5, 1.8, 2.2, 2.6, 4.5];   // 7 дней, заметный скачок на последнем
function dailyBase(){
  return Math.max(60, Math.floor(TIERS[Math.min(MAX_TIER,S.bestTier)].value*8 + S.bestScore*0.06));
}
const dailyDayIndex = st => ((Math.max(1,st)-1)%7)+1;      // 1..7
function dailyReward(day){ return Math.max(20, Math.floor(dailyBase()*DAILY_MULT[Math.min(6,Math.max(0,day-1))])); }
const dailyPending = () => S.lastClaimDay !== dayStr();
function nextStreak(){
  const yesterday = dayStr(Date.now()-86400000);
  return (S.lastClaimDay === yesterday) ? S.streak+1 : 1;   // пропуск дня обнуляет серию
}
function renderDaily(){
  const st=nextStreak(), cur=dailyDayIndex(st);
  $("dailyT").textContent = T("dailyT");
  $("dailyStreak").textContent = T("dailyStreak",{n:st});
  const g=$("dailyGrid"); g.innerHTML='';
  for(let d=1; d<=7; d++){
    const cell=document.createElement('div');
    cell.className='dcell'+(d<cur?' done':'')+(d===cur?' now':'');
    cell.innerHTML='<div>'+d+'</div><div class="dv">+'+fmt(dailyReward(d))+'</div>';
    g.appendChild(cell);
  }
  $("dailyClaim").textContent = T("dailyClaim",{n:fmt(dailyReward(cur))});
  $("dailyClaimX2").textContent = T("dailyClaimX2");
}
function claimDaily(x2){
  if(!dailyPending()){ closeDaily(); return; }
  const give = () => {
    if(!dailyPending()){ closeDaily(); return; }    // в один день награда выдаётся ровно один раз
    S.streak = nextStreak();
    S.lastClaimDay = dayStr();
    const n = grant(dailyReward(dailyDayIndex(S.streak)) * (x2?2:1));
    closeDaily(); refreshHud(); persist(true); sfx("coin");
    toast(T("dailyGot",{n:fmt(n)}));
  };
  if(x2) showRewarded(give); else give();
}

// ---------- Canvas ----------
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
let jarLeft=0,jarRight=0,jarTop=0,jarBottom=0,overflowY=0,unit=60,centerX=0;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  const playW = Math.min(W, 560);
  centerX = W/2;
  const jarWidth = playW*0.64;
  jarLeft = centerX - jarWidth/2; jarRight = centerX + jarWidth/2;
  jarTop = H*0.30; jarBottom = H*0.85;
  unit = jarWidth;
  computeOverflowY();
  for(const b of balls) b.r = TIERS[b.t].ratio*unit;
}
// Линия переполнения зависит от апгрейда cap — считаем отдельно, чтобы
// покупка «Вежливой банки» действовала сразу, без перезагрузки.
function computeOverflowY(){
  overflowY = jarTop + (jarBottom-jarTop)*(0.08 + S.up.cap*0.03);
}
addEventListener("resize",resize);
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------- Живой мир: частицы ----------
const sparkle = {x:0,y:0,phase:Math.random()*10};
const moth = {phase:Math.random()*10};
let steamPhase=0, curtainPhase=0;

// ---------- Фон: кухонное окно, банка на подоконнике ----------
function drawBackground(){
  const wallG=ctx.createLinearGradient(0,0,0,H);
  wallG.addColorStop(0,'#FBEFE0'); wallG.addColorStop(1,cssVar('--bg'));
  ctx.fillStyle=wallG; ctx.fillRect(0,0,W,H);

  // обои: мелкий точечный узор
  ctx.fillStyle='rgba(255,255,255,0.35)';
  const step=Math.max(34, unit*0.22);
  for(let y=20;y<H*0.62;y+=step){
    for(let x=(Math.floor(y/step)%2)*step/2;x<W;x+=step){
      ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
    }
  }

  // окно с небом
  const winW=Math.min(W*0.5, 300), winH=winW*0.72;
  const winX=W*0.5+ (W>560? W*0.18:0) - winW/2, winY=H*0.05;
  ctx.save();
  const skyG=ctx.createLinearGradient(0,winY,0,winY+winH);
  skyG.addColorStop(0,'#BEE3F5'); skyG.addColorStop(1,'#E8F6EE');
  roundRect(winX,winY,winW,winH,18); ctx.clip();
  ctx.fillStyle=skyG; ctx.fillRect(winX,winY,winW,winH);
  // солнце
  const sunX=winX+winW*0.72, sunY=winY+winH*0.28;
  const sunG=ctx.createRadialGradient(sunX,sunY,2,sunX,sunY,winW*0.32);
  sunG.addColorStop(0,'rgba(255,240,180,0.95)'); sunG.addColorStop(1,'rgba(255,240,180,0)');
  ctx.fillStyle=sunG; ctx.beginPath(); ctx.arc(sunX,sunY,winW*0.32,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFE9A6'; ctx.beginPath(); ctx.arc(sunX,sunY,winW*0.11,0,Math.PI*2); ctx.fill();
  // облака
  drawCloud(winX+winW*0.22, winY+winH*0.62, winW*0.16);
  drawCloud(winX+winW*0.5, winY+winH*0.78, winW*0.12);
  // мотылёк за окном
  const mp=(performance.now()/2200 + moth.phase)%1;
  const mx=winX+winW*0.15+mp*winW*0.7, my=winY+winH*0.45+Math.sin(mp*Math.PI*6)*winH*0.08;
  drawMoth(mx,my,10);
  ctx.restore();
  ctx.strokeStyle=cssVar('--line'); ctx.lineWidth=5;
  roundRectPath(winX,winY,winW,winH,18); ctx.stroke();
  // рама-крест
  ctx.beginPath(); ctx.moveTo(winX+winW/2,winY); ctx.lineTo(winX+winW/2,winY+winH);
  ctx.moveTo(winX,winY+winH/2); ctx.lineTo(winX+winW,winY+winH/2);
  ctx.lineWidth=4; ctx.strokeStyle=cssVar('--line'); ctx.stroke();

  // занавески
  const cph=Math.sin(performance.now()/1600+curtainPhase)*4;
  drawCurtain(winX-6, winY-8, winH+16, -1, cph);
  drawCurtain(winX+winW+6, winY-8, winH+16, 1, cph);

  // деревянная полка/подоконник
  const shelfY=jarBottom+unit*0.06;
  const woodG=ctx.createLinearGradient(0,shelfY,0,H);
  woodG.addColorStop(0,cssVar('--wood')); woodG.addColorStop(1,cssVar('--wood-deep'));
  ctx.fillStyle=woodG; ctx.fillRect(0,shelfY,W,H-shelfY);
  ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=2;
  for(let x=0;x<W;x+=unit*0.5){ ctx.beginPath(); ctx.moveTo(x,shelfY+6); ctx.lineTo(x+10,H); ctx.stroke(); }
  ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(0,shelfY,W,4);

  // decor: чашка с блюдцем слева на полке (пар — живой мир)
  const cupX=Math.max(30,centerX-unit*0.9), cupY=shelfY+unit*0.16;
  drawTeacup(cupX,cupY,unit*0.22);
  drawSteam(cupX,cupY-unit*0.22,unit*0.16);

  // decor: банка с печеньем справа
  const jar2X=Math.min(W-30,centerX+unit*0.95), jar2Y=shelfY+unit*0.02;
  drawCookieJar(jar2X,jar2Y,unit*0.24);
}
function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function roundRect(x,y,w,h,r){ roundRectPath(x,y,w,h,r); }
function drawCloud(x,y,r){
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(x,y,r*0.6,0,Math.PI*2);
  ctx.arc(x+r*0.55,y+r*0.08,r*0.45,0,Math.PI*2);
  ctx.arc(x-r*0.55,y+r*0.1,r*0.4,0,Math.PI*2);
  ctx.fill();
}
function drawMoth(x,y,s){
  const flap=Math.sin(performance.now()/90)*0.5+0.5;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#B08CD9'; ctx.strokeStyle=cssVar('--line'); ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(-s*0.5,0,s*0.55,s*0.32*(0.4+flap*0.6),0.4,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(s*0.5,0,s*0.55,s*0.32*(0.4+flap*0.6),-0.4,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#5B4636'; ctx.beginPath(); ctx.ellipse(0,0,s*0.16,s*0.42,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawCurtain(x,yTop,h,dir,sway){
  ctx.save();
  ctx.fillStyle='rgba(255,143,163,0.55)';
  ctx.strokeStyle=cssVar('--line'); ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(x,yTop);
  ctx.quadraticCurveTo(x+dir*(14+sway), yTop+h*0.5, x+dir*4, yTop+h);
  ctx.lineTo(x+dir*22, yTop+h);
  ctx.quadraticCurveTo(x+dir*(30+sway), yTop+h*0.5, x+dir*22, yTop);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawTeacup(x,y,r){
  ctx.strokeStyle=cssVar('--line'); ctx.lineWidth=2;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(x,y,r,r*0.62,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#E9BFD1';
  ctx.beginPath(); ctx.ellipse(x,y-r*0.12,r*0.72,r*0.4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+r*1.05,y,r*0.32,r*0.24,0,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x,y+r*0.5,r*1.15,r*0.28,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke();
}
function drawSteam(x,y,h){
  const t=performance.now()/900+steamPhase;
  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=3; ctx.lineCap='round';
  for(let i=0;i<2;i++){
    const ph=(t+i*0.5)%1;
    ctx.globalAlpha=1-ph;
    ctx.beginPath();
    ctx.moveTo(x-4+i*8,y);
    ctx.quadraticCurveTo(x-4+i*8+Math.sin(ph*8)*6, y-h*ph*0.6, x-4+i*8+Math.sin(ph*6)*4, y-h*ph);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawCookieJar(x,y,r){
  ctx.strokeStyle=cssVar('--line'); ctx.lineWidth=2;
  ctx.fillStyle='rgba(234,246,251,0.85)';
  roundRectPath(x-r*0.7,y-r*1.5,r*1.4,r*1.5,r*0.3); ctx.fill(); ctx.stroke();
  ctx.fillStyle=cssVar('--wood-deep');
  roundRectPath(x-r*0.8,y-r*1.75,r*1.6,r*0.32,r*0.15); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#D9A25C';
  for(const dy of [-1.1,-0.7,-0.3]) { ctx.beginPath(); ctx.arc(x-r*0.25,y+dy*r*0.55,r*0.14,0,Math.PI*2); ctx.fill(); }
}

// ---------- Мир: банка + конфеты ----------
function drawJar(){
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(jarLeft, jarTop);
  ctx.lineTo(jarLeft, jarBottom-14); ctx.arcTo(jarLeft,jarBottom,jarLeft+14,jarBottom,14);
  ctx.lineTo(jarRight-14, jarBottom); ctx.arcTo(jarRight,jarBottom,jarRight,jarBottom-14,14);
  ctx.lineTo(jarRight, jarTop);
  const glassG=ctx.createLinearGradient(jarLeft,0,jarRight,0);
  glassG.addColorStop(0,'rgba(234,246,251,0.55)'); glassG.addColorStop(0.5,'rgba(255,255,255,0.25)'); glassG.addColorStop(1,'rgba(234,246,251,0.55)');
  ctx.fillStyle=glassG; ctx.fill();
  ctx.restore();

  // конфеты внутри (клип по банке)
  ctx.save();
  ctx.beginPath();
  ctx.rect(jarLeft-2, jarTop-200, jarRight-jarLeft+4, jarBottom-jarTop+200);
  ctx.clip();
  for(const b of balls) drawCandy(ctx,b.x,b.y,b.r,b.t,1);
  ctx.restore();

  // передняя стеклянная стенка + контур + блик
  ctx.beginPath();
  ctx.moveTo(jarLeft, jarTop);
  ctx.lineTo(jarLeft, jarBottom-14); ctx.arcTo(jarLeft,jarBottom,jarLeft+14,jarBottom,14);
  ctx.lineTo(jarRight-14, jarBottom); ctx.arcTo(jarRight,jarBottom,jarRight,jarBottom-14,14);
  ctx.lineTo(jarRight, jarTop);
  ctx.strokeStyle=cssVar('--line'); ctx.lineWidth=4.5; ctx.stroke();
  // горлышко/ободок
  ctx.beginPath(); ctx.moveTo(jarLeft-6,jarTop); ctx.lineTo(jarRight+6,jarTop);
  ctx.lineWidth=6; ctx.strokeStyle=cssVar('--line'); ctx.stroke();
  // блик
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(jarLeft+ (jarRight-jarLeft)*0.16, jarTop+10); ctx.lineTo(jarLeft+(jarRight-jarLeft)*0.16, jarBottom-20); ctx.stroke();

  // линия переполнения (тонкая, полупрозрачная, только индикатор)
  if(overflowTimer>0){
    ctx.strokeStyle='rgba(232,99,124,0.8)'; ctx.lineWidth=2; ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(jarLeft,overflowY); ctx.lineTo(jarRight,overflowY); ctx.stroke();
    ctx.setLineDash([]);
  }
}
function drawCandy(c,x,y,r,tier,alpha){
  const T2=TIERS[tier];
  c.save(); c.globalAlpha=alpha; c.translate(x,y);
  c.lineWidth=Math.max(1.6, r*0.09);
  c.strokeStyle=cssVar? cssVar('--line')||'#5B4636' : '#5B4636';
  c.fillStyle=T2.fill;
  if(tier===0){ // мятная конфетка: круг со спиральной полосой
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill(); c.stroke();
    c.strokeStyle=T2.accent; c.lineWidth=r*0.22; c.beginPath();
    for(let a=-Math.PI;a<=Math.PI;a+=0.25){ const rr=r*0.7; c.lineTo(Math.cos(a)*rr*0.9, Math.sin(a)*rr*0.5+a*r*0.12); }
    c.stroke();
  } else if(tier===1){ // мармеладка: приплюснутый овал с зерном сахара
    c.beginPath(); c.ellipse(0,0,r,r*0.82,0,0,Math.PI*2); c.fill(); c.stroke();
    c.fillStyle='rgba(255,255,255,0.5)';
    c.beginPath(); c.ellipse(-r*0.3,-r*0.3,r*0.28,r*0.16,0.6,0,Math.PI*2); c.fill();
    c.fillStyle=T2.accent;
    for(const p of [[-.4,.3],[.3,.45],[.5,-.2],[-.1,.55]]) { c.beginPath(); c.arc(p[0]*r,p[1]*r,r*0.06,0,Math.PI*2); c.fill(); }
  } else if(tier===2){ // карамелька с двумя «хвостиками» обёртки
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill(); c.stroke();
    c.fillStyle=T2.accent;
    c.beginPath(); c.moveTo(-r*0.95,-r*0.3); c.lineTo(-r*1.5,-r*0.55); c.lineTo(-r*1.5,r*0.05); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(r*0.95,r*0.3); c.lineTo(r*1.5,r*0.55); c.lineTo(r*1.5,-r*0.05); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle=T2.accent; c.lineWidth=r*0.1;
    c.beginPath(); c.moveTo(-r*0.5,-r*0.5); c.lineTo(r*0.5,r*0.5); c.moveTo(-r*0.1,-r*0.65); c.lineTo(r*0.65,r*0.05); c.stroke();
  } else if(tier===3){ // трюфель: шар с завитком и фольгой у основания
    c.beginPath(); c.arc(0,r*0.05,r*0.92,0,Math.PI*2); c.fill(); c.stroke();
    c.fillStyle=T2.accent;
    c.beginPath(); c.moveTo(-r*0.5,-r*0.3);
    c.bezierCurveTo(-r*0.2,-r*0.9,r*0.2,-r*0.9,r*0.5,-r*0.3);
    c.bezierCurveTo(r*0.2,-r*0.45,-r*0.2,-r*0.45,-r*0.5,-r*0.3);
    c.fill(); c.stroke();
    c.strokeStyle=T2.accent; c.lineWidth=r*0.16;
    for(let i=-2;i<=2;i++){ c.beginPath(); c.moveTo(i*r*0.15,r*0.85); c.lineTo(i*r*0.15,r*1.05); c.stroke(); }
  } else if(tier===4){ // пончик: кольцо с глазурью и полосками
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill(); c.stroke();
    c.beginPath(); c.arc(0,0,r*0.4,0,Math.PI*2); c.fillStyle=cssVar('--bg')||'#FCE8D8'; c.fill(); c.stroke();
    c.fillStyle=T2.accent;
    c.beginPath(); c.arc(0,-r*0.12,r*0.92,Math.PI*1.02,Math.PI*1.98); c.arc(0,0,r*0.42,Math.PI*1.98,Math.PI*1.02,true); c.closePath(); c.fill();
    c.strokeStyle='#fff'; c.lineWidth=r*0.09; c.lineCap='round';
    for(const a of [-1.3,-0.9,-0.5,-0.1]) { c.beginPath(); c.moveTo(Math.cos(a)*r*0.55,Math.sin(a)*r*0.55-r*0.05); c.lineTo(Math.cos(a)*r*0.85,Math.sin(a)*r*0.85-r*0.05); c.stroke(); }
  } else if(tier===5){ // капкейк: гофрированная чашка + завиток крема
    c.fillStyle=T2.accent;
    c.beginPath(); c.moveTo(-r*0.68,r*0.15); c.lineTo(-r*0.5,r*0.95); c.lineTo(r*0.5,r*0.95); c.lineTo(r*0.68,r*0.15); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle=T2.accent; c.lineWidth=r*0.06;
    for(let i=-2;i<=2;i++){ c.beginPath(); c.moveTo(i*r*0.22,r*0.2); c.lineTo(i*r*0.18,r*0.9); c.stroke(); }
    c.fillStyle=T2.fill; c.strokeStyle=cssVar('--line');
    c.beginPath();
    c.arc(-r*0.35,-r*0.05,r*0.4,0,Math.PI*2);
    c.arc(0,-r*0.35,r*0.42,0,Math.PI*2);
    c.arc(r*0.35,-r*0.05,r*0.4,0,Math.PI*2);
    c.fill(); c.stroke();
    c.fillStyle=T2.accent; c.beginPath(); c.arc(0,-r*0.6,r*0.12,0,Math.PI*2); c.fill(); c.stroke();
  } else if(tier===6){ // кусок торта: клин с кремовыми слоями
    c.beginPath(); c.moveTo(0,-r); c.lineTo(r*0.95,r*0.75); c.lineTo(-r*0.95,r*0.75); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle=T2.accent;
    c.beginPath(); c.rect(-r*0.63,r*0.05,r*1.26,r*0.22); c.fill();
    c.beginPath(); c.moveTo(-r*0.3,-r*0.4); c.quadraticCurveTo(0,-r*0.65,r*0.3,-r*0.4); c.quadraticCurveTo(0,-r*0.15,-r*0.3,-r*0.4); c.fillStyle='#fff'; c.fill(); c.stroke();
  } else { // праздничный торт: двухъярусный + свечка
    c.fillStyle=T2.fill;
    c.beginPath(); roundRectLocal(c,-r*0.85,r*0.1,r*1.7,r*0.55,r*0.12); c.fill(); c.stroke();
    c.beginPath(); roundRectLocal(c,-r*0.55,-r*0.45,r*1.1,r*0.55,r*0.1); c.fill(); c.stroke();
    c.fillStyle=T2.accent;
    c.beginPath(); c.rect(-r*0.85,r*0.32,r*1.7,r*0.1); c.fill();
    c.beginPath(); c.rect(-r*0.55,-r*0.22,r*1.1,r*0.08); c.fill();
    c.strokeStyle=T2.accent; c.fillStyle='#FFF6DE';
    c.beginPath(); c.rect(-r*0.05,-r*0.85,r*0.1,r*0.4); c.fill(); c.stroke();
    c.fillStyle='#F2C14E';
    c.beginPath(); c.moveTo(0,-r*0.85); c.quadraticCurveTo(r*0.14,-r*1.02,0,-r*1.12); c.quadraticCurveTo(-r*0.14,-r*1.02,0,-r*0.85); c.fill();
  }
  c.restore();
}
function roundRectLocal(c,x,y,w,h,r){
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

// сахарная искра, парящая рядом с банкой
function drawSparkle(){
  const t=performance.now()/1000;
  const cx = jarLeft + (jarRight-jarLeft)*(0.5+0.42*Math.sin(t*0.5));
  const cy = jarTop - unit*0.22 + Math.sin(t*1.3)*unit*0.06;
  const s = (Math.sin(t*3)+1)/2;
  ctx.save(); ctx.globalAlpha=0.55+0.45*s; ctx.fillStyle='#FFF3B0'; ctx.strokeStyle='#E8B84B'; ctx.lineWidth=1;
  ctx.translate(cx,cy); ctx.rotate(t);
  const r=4+2*s;
  ctx.beginPath();
  for(let i=0;i<4;i++){ const a=i*Math.PI/2; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); ctx.lineTo(Math.cos(a+Math.PI/4)*r*0.35,Math.sin(a+Math.PI/4)*r*0.35); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ---------- Ghost-конфета для прицеливания ----------
let aimX=0, aiming=false, nextTier=0, dropCooldown=0;
function pickNextTier(){
  const pm=poolMax();
  const weights=[];
  for(let t=0;t<=pm;t++) weights.push(pm - t + 1);
  weights[pm]+=S.up.luck*1.4;
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let t=0;t<=pm;t++){ r-=weights[t]; if(r<=0) return t; }
  return 0;
}
function drawGhost(){
  const r=TIERS[nextTier].ratio*unit;
  const x=Math.max(jarLeft+r, Math.min(jarRight-r, aimX||centerX));
  drawCandy(ctx, x, jarTop-40, r, nextTier, aiming?0.85:0.55);
  ctx.save(); ctx.strokeStyle='rgba(91,70,54,0.35)'; ctx.setLineDash([3,5]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x, jarTop-40+r); ctx.lineTo(x, jarTop); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
}

// ---------- Физика ----------
let balls=[]; // {x,y,vx,vy,r,t}
const GRAVITY=1400;
function spawnBall(x,t,yOverride){
  const r=TIERS[t].ratio*unit;
  balls.push({x:Math.max(jarLeft+r,Math.min(jarRight-r,x)), y:yOverride!=null?yOverride:jarTop-40, vx:0, vy:0, r, t});
  if(balls.length>90) balls.shift();
}
function doDrop(x){
  const now=performance.now();
  if(now-dropCooldown<320) return;
  dropCooldown=now;
  const r=TIERS[nextTier].ratio*unit;
  spawnBall(Math.max(jarLeft+r,Math.min(jarRight-r,x)), nextTier);
  sfx('tap');
  nextTier=pickNextTier();
  persist();
}
let overflowTimer=0;
function stepPhysics(dtMs){
  let dt=dtMs/1000;
  const substeps=Math.min(6, Math.max(1, Math.ceil(dt/0.016)));
  const sdt=dt/substeps;
  for(let s=0;s<substeps;s++) physicsSub(sdt);
}
function physicsSub(dt){
  for(const b of balls){
    b.vy += GRAVITY*dt;
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.x-b.r<jarLeft){ b.x=jarLeft+b.r; b.vx*=-0.28; }
    if(b.x+b.r>jarRight){ b.x=jarRight-b.r; b.vx*=-0.28; }
    if(b.y+b.r>jarBottom){ b.y=jarBottom-b.r; b.vy*=-0.22; b.vx*=0.9; }
  }
  // merge pass
  let merged=true, guard=0;
  while(merged && guard<6){
    merged=false; guard++;
    outer:
    for(let i=0;i<balls.length;i++){
      for(let j=i+1;j<balls.length;j++){
        const a=balls[i], b=balls[j];
        if(a.t!==b.t || a.t>=MAX_TIER) continue;
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
        if(d < (a.r+b.r)*0.92){
          const nt=a.t+1;
          const nx=(a.x+b.x)/2, ny=(a.y+b.y)/2;
          balls.splice(j,1); balls.splice(i,1);
          const nr=TIERS[nt].ratio*unit;
          balls.push({x:nx,y:Math.min(ny, jarBottom-nr), vx:(a.vx+b.vx)*0.2, vy:Math.min((a.vy+b.vy)*0.2,-60), r:nr, t:nt});
          const gain = earn(Math.max(1, Math.round(TIERS[nt].value*multValue())));
          S.fillCoins += gain;
          if(nt>S.bestTier) S.bestTier=nt;
          if(nt>runBestTier) runBestTier=nt;
          if(S.discovered.indexOf(nt)<0) S.discovered.push(nt);
          if(nt===MAX_TIER) maybeReview();   // яркое событие — момент для запроса оценки
          sfx('coin');
          merged=true;
          break outer;
        }
      }
    }
  }
  // overlap resolution (different tiers)
  for(let iter=0;iter<3;iter++){
    for(let i=0;i<balls.length;i++){
      for(let j=i+1;j<balls.length;j++){
        const a=balls[i], b=balls[j];
        const dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy);
        const minD=a.r+b.r;
        if(d<minD && d>0.0001){
          const overlap=(minD-d)/2, nx=dx/d, ny=dy/d;
          const totalR=a.r+b.r, wa=b.r/totalR, wb=a.r/totalR;
          a.x-=nx*overlap*wa; a.y-=ny*overlap*wa;
          b.x+=nx*overlap*wb; b.y+=ny*overlap*wb;
          a.vx*=0.85; b.vx*=0.85;
        } else if(d<=0.0001){
          a.x-=0.5; b.x+=0.5;
        }
      }
    }
    for(const b of balls){
      if(b.x-b.r<jarLeft) b.x=jarLeft+b.r;
      if(b.x+b.r>jarRight) b.x=jarRight-b.r;
      if(b.y+b.r>jarBottom) b.y=jarBottom-b.r;
    }
  }
  // переполнение
  const over = balls.some(b=>b.y-b.r < overflowY);
  if(over){
    overflowTimer += dt;
    if(overflowTimer>2.6) triggerJarFull();
  } else overflowTimer=Math.max(0, overflowTimer-dt*2);
}

// ---------- Отрисовка мира ----------
function drawWorld(){
  drawJar();
  drawSparkle();
  if(!anyModalOpen() && !gameOver) drawGhost();
}

let lastT=performance.now();
function frame(now){
  window.__firstFrame = true;                 // тест-хук: первый кадр отрисован
  let dt=Math.max(0,Math.min(50, now-lastT)); lastT=now;
  if(!paused) stepPhysics(dt);
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawWorld();
  refreshCoinsOnly();
  tipsTick();
  requestAnimationFrame(frame);
}
let hudThrottle=0, actThrottle=0;
function refreshCoinsOnly(){
  const now=performance.now();
  if(now-actThrottle>1000){ actThrottle=now; refreshActions(); }
  if(now-hudThrottle<200) return; hudThrottle=now;
  $("coinsV").textContent=fmt(S.coins);
  $("bestV").textContent=fmt(S.bestScore);
  $("specialBtn").disabled = S.coins < specialCost();
  $("specialSub").textContent = fmt(specialCost());
}

// ---------- Ввод ----------
function pointerX(e){ const rect=cv.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX); return cx-rect.left; }
cv.addEventListener('pointerdown', e=>{ if(anyModalOpen()||gameOver) return; aiming=true; aimX=pointerX(e); });
cv.addEventListener('pointermove', e=>{ if(anyModalOpen()||gameOver) return; if(aiming) aimX=pointerX(e); });
cv.addEventListener('pointerup', e=>{ if(anyModalOpen()||gameOver) return; if(aiming){ doDrop(aimX); } aiming=false; });
cv.addEventListener('pointercancel', ()=>{ aiming=false; });

// ---------- Модалки ----------
let shopOpen=false, collOpen=false, dailyOpen=false, overOpen=false, scOpen=false;
const anyModalOpen = () => shopOpen||collOpen||dailyOpen||overOpen||scOpen;
function openShop(){ hideTip(); shopOpen=true; renderShop(); $("shopModal").classList.add('on'); }
function closeShop(){ shopOpen=false; $("shopModal").classList.remove('on'); }
function openColl(){ hideTip(); collOpen=true; renderCollection(); $("collectionModal").classList.add('on'); }
function closeColl(){ collOpen=false; $("collectionModal").classList.remove('on'); }
function openDaily(){ hideTip(); dailyOpen=true; renderDaily(); $("dailyModal").classList.add('on'); }
function closeDaily(){ dailyOpen=false; $("dailyModal").classList.remove('on'); }
function closeOver(){ overOpen=false; $("overModal").classList.remove('on'); }
function openShortcut(){
  hideTip(); scOpen=true;
  $("scT").textContent = T("scT");
  $("scD").textContent = T("scD",{n:SHORTCUT_REWARD});
  $("scYes").textContent = T("scYes"); $("scNo").textContent = T("scNo");
  $("scModal").classList.add('on');
}
function closeShortcut(){ scOpen=false; $("scModal").classList.remove('on'); }
function dailyCheck(){ if(dailyPending()) openDaily(); }

// ---------- Конец забега ----------
// Переполнение — честный фейл-стейт: награда за забег зависит от достигнутого
// тира, а не от того, как быстро игрок завалил банку.
function triggerJarFull(){
  if(gameOver) return;
  gameOver=true; paused=true; overflowTimer=0;
  const bonus = grant(Math.max(10, Math.floor(TIERS[Math.min(MAX_TIER,runBestTier)].value*2.5)));
  const record = S.fillCoins>S.bestScore;
  if(record) S.bestScore=S.fillCoins;
  submitScore(S.bestScore);
  sfx('error');
  overOpen=true;
  $("overT").textContent = T("overT");
  $("overRun").textContent  = T("overRun",{n:fmt(S.fillCoins)});
  $("overBonus").textContent = T("overBonus",{n:fmt(bonus)});
  $("overBest").textContent = record ? T("overBest") : "";
  $("overContLab").textContent = T("overCont");
  $("overContSub").textContent = T("overContSub");
  $("overRestart").textContent = T("overRestart");
  $("overModal").classList.add('on');
  persist(true); refreshHud();
}
function restartRun(){
  closeOver();
  balls.length=0; S.fillCoins=0; overflowTimer=0; runBestTier=0;
  gameOver=false; paused=false;
  persist(true); refreshHud();
  maybeInterstitial();                     // реклама только в паузе между забегами
  setTimeout(maybeShortcut, 900);
}
// Rewarded «Продолжить»: убрать 5 самых мелких конфет и не терять забег.
function continueRun(){
  if(!gameOver) return;
  showRewarded(()=>{
    balls.sort((a,b)=>a.r-b.r);
    const removed = balls.splice(0, Math.min(5, balls.length));
    for(const b of balls) b.vy=Math.min(b.vy, 0);
    overflowTimer=0; gameOver=false; paused=false;
    closeOver(); refreshHud(); persist(true); sfx('coin');
    toast(T('contGot',{n:removed.length}));
  });
}

// ---------- Ярлык на главный экран ----------
let shortcutCan=false;
function checkShortcut(){
  try{
    if(!(ysdk && ysdk.shortcut && ysdk.shortcut.canShowPrompt)) return;
    const p = ysdk.shortcut.canShowPrompt();
    if(p && p.then) p.then(r=>{ shortcutCan = !!(r && r.canShow); }).catch(()=>{});
  }catch(e){}
}
// Предлагаем один раз и только втянувшемуся игроку, не на старте.
function maybeShortcut(){
  if(S.shortcutDone || !shortcutCan || anyModalOpen() || !booted) return;
  if(S.lifetimeEarned < 400 || S.bestTier < 3) return;
  openShortcut();
}
function acceptShortcut(){
  S.shortcutDone=true; closeShortcut(); persist(true);
  try{
    const p = ysdk.shortcut.showPrompt();      // строго из обработчика нажатия игрока
    if(p && p.then) p.then(res=>{
      if(res && res.outcome==='accepted'){
        const n=grant(SHORTCUT_REWARD); refreshHud(); persist(true); sfx('coin');
        toast(T('scGot',{n:fmt(n)}));
      }
    }).catch(()=>{});
  }catch(e){}
}
function declineShortcut(){ S.shortcutDone=true; closeShortcut(); persist(true); }

// ---------- Запрос оценки ----------
// Момент — сразу после яркого события (первый праздничный торт), не на старте
// и не после провала. Запасной сценарий: оценка недоступна — молча выходим
// и пробуем в следующей сессии.
let reviewTried=false;
function maybeReview(){
  if(S.reviewDone || reviewTried) return;
  reviewTried=true;
  if(!(ysdk && ysdk.feedback && ysdk.feedback.canReview)) return;
  try{
    const p = ysdk.feedback.canReview();
    if(!(p && p.then)) return;
    p.then(can=>{
      if(!(can && can.value)) return;          // недоступно — ничего не показываем
      S.reviewDone=true; persist(true);
      const r = ysdk.feedback.requestReview();
      if(r && r.catch) r.catch(()=>{});
    }).catch(()=>{});
  }catch(e){}
}

// ---------- Контекстные подсказки ----------
// Отдельная от туториала система: 3 подсказки на всю игру, по одной за раз,
// один раз навсегда (флаг в сейве), только когда механикой уже можно
// воспользоваться, и никогда поверх открытой модалки.
const TIPS = [
  { id:'gift',  target:'giftBtn',  text:()=>T('tipGift'),  when:()=>S.bestTier>=2 && giftReady() },
  { id:'shake', target:'shakeBtn', text:()=>T('tipShake'), when:()=>shakeReady() && overflowTimer>0.6 },
  { id:'goal',  target:'goalBar', text:()=>T('tipGoal'), when:()=>goalReady() && S.goal===0 },
  { id:'shop',  target:'shopBtn',  text:()=>T('tipShop'),  when:()=>S.up.mult===0 && S.coins>=multCost() },
];
let tipActive=null, tipHideT=0, tipTickT=0;
function hideTip(){
  if(!tipActive) return;
  const el=$("tip"), tgt=$(tipActive.target);
  el.classList.remove('on');
  if(tgt) tgt.classList.remove('tip-target');
  clearTimeout(tipHideT); tipActive=null;
}
function showTip(tip){
  const tgt=$(tip.target); if(!tgt) return;
  tipActive=tip;
  if(!S.tips || typeof S.tips!=='object') S.tips={};
  S.tips[tip.id]=1; persist(true);
  const el=$("tip");
  el.textContent = tip.text();
  const r=tgt.getBoundingClientRect(), half=el.offsetWidth/2 || 100;
  el.style.left = Math.max(half+8, Math.min(innerWidth-half-8, r.left+r.width/2))+'px';
  el.style.top  = Math.max(el.offsetHeight+8, r.top-10)+'px';
  el.classList.add('on');
  tgt.classList.add('tip-target');
  clearTimeout(tipHideT); tipHideT=setTimeout(hideTip, 11000);   // сама исчезает
}
function tipsTick(){
  const now=performance.now();
  if(now-tipTickT<500) return; tipTickT=now;
  if(tipActive || anyModalOpen() || !booted) return;             // ждёт закрытия модалки
  if(!S.tips || typeof S.tips!=='object') S.tips={};
  for(const t of TIPS){
    if(S.tips[t.id]) continue;
    let ok=false; try{ ok=!!t.when(); }catch(e){}
    if(ok){ showTip(t); return; }
  }
}
addEventListener('pointerdown', ()=>{ if(tipActive) hideTip(); }, true);   // любой тап снимает

// ---------- Тест-хуки ----------
window.render_game_to_text = () => JSON.stringify({
  coins:S.coins, bestTier:S.bestTier, bestScore:S.bestScore, fillCoins:S.fillCoins,
  lifetimeEarned:S.lifetimeEarned, streak:S.streak, lastClaimDay:S.lastClaimDay,
  discovered:S.discovered.slice(), ballCount:balls.length, nextTier:nextTier,
  up:{pool:S.up.pool, luck:S.up.luck, cap:S.up.cap, mult:S.up.mult},
  overflowing: overflowTimer>0, specialCost:specialCost(),
  overflowY:Math.round(overflowY), gameOver:gameOver, paused:paused,
  tips:Object.assign({}, S.tips), shortcutDone:S.shortcutDone, reviewDone:S.reviewDone,
  goal:S.goal, goalReady:goalReady(),
});
window.advanceTime = ms => { stepPhysics(ms); refreshHud(); };
window.testDrop = (xFrac, tier) => {
  const t=Math.max(0,Math.min(MAX_TIER, tier));
  const x=jarLeft + (jarRight-jarLeft)*xFrac;
  spawnBall(x, t, jarTop+ (jarBottom-jarTop)*0.3);
};
window.testClearJar = () => { balls.length=0; overflowTimer=0; gameOver=false; paused=false; closeOver(); };
window.testSetCoins = n => { S.coins=n; refreshHud(); };
window.testForceOverflow = () => { overflowTimer=3; triggerJarFull(); restartRun(); };
window.testGameOver = () => { overflowTimer=3; triggerJarFull(); };
window.testSetState = patch => { Object.assign(S, patch); refreshHud(); };
window.testDailyCheck = () => dailyCheck();
window.testDailyInfo = () => ({pending:dailyPending(), streak:nextStreak(), day:dailyDayIndex(nextStreak()),
  reward:dailyReward(dailyDayIndex(nextStreak()))});
window.testBallTiers = () => balls.map(b=>b.t);
window.testSubmit = v => submitScore(v);
window.testShowInterstitial = () => showInterstitial();
window.testMaybeInterstitial = () => maybeInterstitial();
window.testAdInfo = () => ({nextAdAt:nextAdAt, adBusy:adBusy, gap:AD_GAP_S, retry:AD_RETRY_S, warmup:AD_WARMUP_S});
window.testTips = () => { tipTickT=0; tipsTick(); };
window.testFlush = () => flushSave();
window.testGoal = () => { const g=goalDef();
  return {id:g.id, i:S.goal, cur:g.cur(), need:g.need(), ready:goalReady(), rew:g.rew()}; };
window.testClaimGoal = () => claimGoal();

// ---------- Boot ----------
function sendReady(){
  if(readySent) return; readySent=true;
  try{
    if(ysdk && ysdk.features && ysdk.features.LoadingAPI && ysdk.features.LoadingAPI.ready)
      ysdk.features.LoadingAPI.ready();
  }catch(e){}
}
function boot(raw){
  if(booted) return; booted=true;
  const hadSave = restore(raw);
  resize();
  nextTier=pickNextTier();
  for(const b of S.balls){
    if(!isTier(b.t)) continue;                       // чужой/битый сейв не должен ронять запуск
    balls.push({x:Number(b.x)||centerX, y:Number(b.y)||jarTop, r:TIERS[b.t].ratio*unit, t:b.t, vx:0, vy:0});
  }
  // самому первому игроку ежедневку на первом запуске не показываем:
  // серия начинается со второго захода
  if(!hadSave){ S.lastClaimDay=dayStr(); S.streak=0; }
  refreshHud();
  $("shopBtn").onclick=openShop; $("closeShop").onclick=closeShop;
  $("collectionBtn").onclick=openColl; $("closeColl").onclick=closeColl;
  $("specialBtn").onclick=doSpecial; $("specialAdBtn").onclick=doSpecialAd;
  $("giftBtn").onclick=doGift; $("shakeBtn").onclick=doShake;
  $("goalBar").onclick=claimGoal;
  $("dailyClaim").onclick=()=>claimDaily(false);
  $("dailyClaimX2").onclick=()=>claimDaily(true);
  $("closeDaily").onclick=closeDaily;
  $("overCont").onclick=continueRun; $("overRestart").onclick=restartRun;
  $("scYes").onclick=acceptShortcut; $("scNo").onclick=declineShortcut;
  startMusic();
  window.__uiReady = true;          // тест-хук: интерфейс собран и готов к действиям игрока
  sendReady();                      // GameReady — ровно перед тем, как игра станет доступна
  requestAnimationFrame(frame);
  if(hadSave) dailyCheck();
  persist(true);
}
(function initSDK(){
  let localRaw=null; try{ localRaw=localStorage.getItem(SAVE_KEY); }catch(e){}
  function start(){
    if(window.YaGames && !window.__noSDK){
      YaGames.init().then(sdk=>{
        ysdk=sdk;
        readSdkLang();                          // I18N: свойство читается до первой отрисовки
        try{ lb = sdk.leaderboards || null; }catch(e){}
        try{
          if(!lb && typeof sdk.getLeaderboards==="function")
            sdk.getLeaderboards().then(x=>{ lb=x; }).catch(()=>{});
        }catch(e){}
        checkShortcut();
        return sdk.getPlayer({scopes:false}).then(p=>{
          player=p;
          try{ authorized = !!(p.isAuthorized && p.isAuthorized()); }catch(e){ authorized=false; }
          return p.getData(["save"]);
        }).then(d=>boot(d&&d.save?d.save:localRaw)).catch(()=>boot(localRaw));
      }).catch(()=>boot(localRaw));
      setTimeout(()=>boot(localRaw),4000);      // страховка: игра стартует и без ответа SDK
    } else boot(localRaw);
  }
  if(window.__noSDK || window.YaGames) start();
  else window.__onSdkScriptDone = start;
})();

// ---------- Фон/фокус: звук и дожим сейва ----------
// Реклама фокус не отнимает — там глушим вручную в onOpen/onClose (см. showRewarded).
addEventListener('visibilitychange', ()=>{
  if(document.hidden){ audioSuspend(); flushSave(); }
  else if(!adBusy){ audioResume(); }
});
addEventListener('pagehide', ()=>{ audioSuspend(); flushSave(); });

</script>
